<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img {
            width: 400px;
            height: 350px;
        }

        h3 {
            font-family: Arial;
            color: #2a2a2a;
            font-size: 14px;
            font-stretch: 18px;
        }

        p {
            font-family: Arial;
            color: #888;
            font-size: 14px;
            line-height: 21px;
        }

        footer {
            color: #dddddd;
            font-size: 10px;
            line-height: 18px;
        }
    </style>
</head>

<body>
    <div>
        <img src="./images/Trump.jpg">
    </div>
    <div>
        <h3>Lãnh đạo tài chính toàn cầu lo lắng cho sự trở lại của ông Trump</h3>
        <p>Các quan chức lo Trump trở lại sẽ xáo trộn tài chính toàn cầu khi tăng thuế mạnh tay, khiến Mỹ nợ thêm hàng
            nghìn tỷ USD và đảo ngược nỗ lực về khí hậu</p>
    </div>
    <footer>Thứ ba, 29/10/2024, 01:15 (GMT+7)</footer>
</body>

</html>
