<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-size: 15pt;
            margin-top: 0.5vh;
            background-color: red;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form {
            display: flex;
            flex-direction: column;
            padding: 5px;
            background-color: aquamarine;
            max-width: 600px;

        }

        .form .item {
            display: flex;
            margin-left: 1vw;
            margin-top: 0.5vw;

        }

        .form .item>label {
            width: 30%;
            font-weight: bold;
        }

        .form .item>input .form .item>textarea {
            border-radius: 5px 5px;

        }

        .form button {
            width: 100%
        }

        @media screen and (max-width:4140px) {
            .form .item>label {
                display: none;
            }

            .form .item {
                display: flex;
                flex-direction: column;
                width: 100%;

            }

            .item {
                margin: 5px;
            }

            .form .item {
                width: 95%;
            }
        }

        @media screen and (min-width:768px) {
            .form .item>label {
                display: flex;
            }
        }


        @media screen and (min-width:1024px) {
            .form .item {
                flex-direction: row;
            }
        }
    </style>
</head>

<body>

</body>
<div class="form">
    <div class="header">
        <h1>Thông Tin Người Dùng</h1>
    </div>
    <form>
        <div class="item hten">
            <label>Họ tên: </label>
            <input type="text" placeholder="Nhập họ tên" required>
        </div>
        <div class="item ngsinh">
            <label>Ngày sinh</label>
            <input type="date">
        </div>
        <div class="item dc">
            <label>Địa chỉ</label>
            <textarea placeholder="Nhập địa chỉ"></textarea>

        </div>
        <button type="submit">Gửi</button>
    </form>


</div>

</html>
