<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #fae9fb;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            background-color: WHITE;
            justify-content: center;
            max-width: 100vh;
            border-radius: 10px;
            box-shadow: 5px 5px#e0dbdb;
            align-items: center;
            padding: 50px;

        }

        h1 {
            color: #ba24c2;
            font-size: 15px;
        }

        form {
            display: flex;
            flex-direction: column;
            margin: 10px;
        }

        input {
            padding-left: 10px;
        }

        .input {
            border: none;
            margin: 5px;
            height: 5vh;
            background-color: #fae9fb;
            color: #a0a0a0;
        }

        .input3 {
            height: 15vh;
            display: flex;
        }

        .form button {
            width: 100%;
            border: none;
            background-color: #ba24c2;
            color: #fae9fb;
            height: 3vh;
            margin-top: -1.5vh;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="/">
        <div class="form">
            <form>
                <h1>Send us a message </h1>
                <input type="text" placeholder="Enter your name" class="input input1" required>
                <input type="email" placeholder="Enter your email" class="input input2" required>
                <input type="text" placeholder="Enter your message" class="input input3" required> <br>
                <button type="submit">Send Now</button>
            </form>

        </div>

    </div>
</body>

</html>
