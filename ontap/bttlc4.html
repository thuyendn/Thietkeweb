<!DOCTYPE html>

    <h1>Chào mừng bạn đến vứi trang web của chúng tui !!!!</h1>
    <div>
        <span id="datetime"></span>  Không có nội dung ban đầu 
        <script>
            window.onload = function() {
                // Lấy ngày và giờ hiện tại
                const now = new Date();
                // Định dạng ngày và giờ
                const day = now.getDate().toString().padStart(2, '0');
                const month = (now.getMonth() + 1).toString().padStart(2, '0'); // Tháng bắt đầu từ 0
                const year = now.getFullYear();
                const hours = now.getHours().toString().padStart(2, '0');
                const minutes = now.getMinutes().toString().padStart(2, '0');
                const seconds = now.getSeconds().toString().padStart(2, '0');
                
                // Hiển thị ngày và giờ
                const dateTime = `Ngày ${day}/${month}/${year} - ${hours}:${minutes}:${seconds}`;
                
                // Cập nhật nội dung trong span
                document.getElementById('datetime').textContent = `Hôm nay là: ${dateTime}`;
            };
        </script>
    </div>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h1 onmouseover="vao()"  onmouseout="ra()">Hãy di chuột vào vb để xem thông báo</h1>
    <p id="oday" style="color: red"></p>
    
    <script>
        function vao(){
            document.getElementById("oday").textContent="Bạn vừa di chuột vào"
        }
        function ra(){
            document.getElementById("oday").textContent=""
        }
    </script>
</body>
</html>
