<!-- ❑ DOM: Document Object Model
❑ Javascript có thể tiếp cận và thay đổi giá trị của các phần tử HTML trên trang
web thông qua DOM

❑ Tìm kiếm một thành phần HTML
❑ document.getElementById(id): tìm theo tên id
❑ document.getElementsByTagName(name)[num]: tìm theo tên thẻ thành
phần name
❑ document.getElementsByClassName(name)[num]: tìm theo tên class
name

<h2>VÍ dụ thể getElementById</h2>

    onclick="document.getElementById('whattime').innerHTML=Date()">

</button>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function oncl(){
            document.getElementsByTagName("p")[0].innerHTML
            ="DÒng một đã đđợc thay dổi r"
        }
    </script>
</head>
<body>

    <button onclick="oncl()">Click here</button>

    <p>DÒng 1</p>
    <p>dòng 2</p>
</body>
</html>

        <p>Thực đưn</p>

<!DOCTYPE html>

    <title>Document</title>

            document.getElementById('row2').style.fontFamily="Arial"

        }

    <p id="row1">hêlô</p>
    <p id="row2" onclick="ham()">hôlê</p>
