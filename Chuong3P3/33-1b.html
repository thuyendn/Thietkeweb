<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gridcontainer{
            background-color: coral;
            gap:5px;
            display:grid;
            padding:5px;
        }
        .items{
            display:flex;
           
            background-color: rgb(255, 237, 203);
            text-align: center;
            padding:20px;
        }
/*        .item1{
            grid-column-start: 1;
            grid-column-end: 4;
            
            
        }
        .item2{
            grid-row-start: 2;
            grid-row-end: 4;
        }
        .item5{
            grid-column-start: 2;
            grid-column-end: 4;

        } */
        @media screen and (max-width:640px){
            .gridcontainer{
                grid-template-columns: auto;
            }
 
        }
        @media (min-width:768px){
            .gridcontainer{
                grid-template-columns: auto auto;
            }

            .item1{
                grid-column:1/3;
            }
            .item2{
                grid-column:1/3;
            }
            .item3{
                grid-column:1/2}
            .item4{
                grid-column:2/3;
            }
            .item5{
                grid-column:1/3;
            }

        }
        @media (min-width:1024px){
            .gridcontainer{
                grid-template-columns: auto auto auto;
            }
            .item1{
                grid-column: 1/4;
                
                
            }
            .item2{
                grid-column: 1/2;
                grid-row: 2/4;
            }
            .item5{
                grid-column: 2/4;
            }
        }
        
    </style>
</head>
<body>
    <div class="gridcontainer">
        <div class="items item1">Header</div>
        <div class="items item2">Menu</div>
        <div class="items item3">Main</div>
        <div class="items item4">Right</div>
        <div class="items item5">Footer</div>
    </div>
</body>
</html>
