<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gridcontainer {
            display:grid;
            grid-template-columns: auto auto auto;
            grid-template-rows: 100px 100px 100px ;
            gap:5px;
        }
        .items{
            text-align: center;
            display:flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }
        .item1{
            grid-column-start: 1;
            grid-column-end: 3;
            background-color: rgb(181, 232, 206);
        }
        .item2{
            background-color: beige;
        }
        .item3{
            grid-row-start: 2;
            grid-row-end: 4;
            background-color: aqua;

        }
        .item4{
            grid-column-start: 2;
            grid-column-end: 4;
            background-color:pink }
        .item5{
            background-color: rgb(159, 159, 212)
        }
        .item6{
            background-color: orange;
        }

    </style>
</head>
<body>
    <div class="gridcontainer">
        <div class="items item1">1</div>
        <div class="items item2">2</div>
        <div class="items item3">3</div>
        <div class="items item4">4</div>
        <div class="items item5">5</div>
        <div class="items item6">6</div>

    </div>
</body>
</html>
