<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Grid with Auto-fit</title>
    <style>
        .grid-container {
            display: grid;
            /* Sử dụng auto-fit để các cột tự động sắp xếp tùy theo kích thước */
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            padding: 10px;
        }

        .item {
            background-color: aquamarine;
            padding: 20px;
            text-align: center;
            font-size: 1.5rem;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="item c1">Mục 1</div>
        <div class="item c2">Mục 2</div>
        <div class="item c3">Mục 3</div>
        <div class="item c4">Mục 4</div>
        <div class="item c5">Mục 5</div>
        <div class="item c6">Mục 6</div>
    </div>
</body>
</html>
