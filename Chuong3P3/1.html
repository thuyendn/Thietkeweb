<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display:grid;
            grid-template-columns: auto auto;
            gap:5px;
            grid-template-rows: auto auto;
        }
        .box{
            background-color: aqua;
            padding:20px;
            text-align: center;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box box1">Mục 1</div>
        <div class="box box2">Mục 2</div>
        <div class="box box3">Mục 3</div>
        <div class="box box4">Mục 4</div>
    </div>
</body>
</html>
