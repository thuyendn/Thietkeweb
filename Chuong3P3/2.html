<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display:grid;
            grid-template-columns: 100px 100px 100px;
            grid-template-rows: auto auto auto;
            gap:5px;
        }
        .box{
            background-color: orange;
            padding:20px;
            text-align: center;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box box1">Mục 1</div>
        <div class="box box2">Mục 2</div>
        <div class="box box3">Mục 3</div>
        <div class="box box4">Mục 4</div>        
        <div class="box box5">Mục 5</div>
        <div class="box box6">Mục 6</div>        
        <div class="box box7">Mục 7</div>
        <div class="box box8">Mục 8</div>
        <div class="box box9">Mục 9</div>
    </div>
</body>
</html>
