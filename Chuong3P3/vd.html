<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: 30% auto 50%;
            grid-template-rows: 70px 120px 90px;
            gap: 20px 20px; 
            }
        /* .grid-container {
            display: inline-grid;
            } */
        .grid-item {
            background-color: #008cff;
            border: 1px solid;
            padding: 10px;
            font-size: 20px;
            text-align: center
            }
       
        .item8 {
            grid-area: 1/2/5/6;
        }
        .grid-container {
            display: grid;
            grid-template-areas:'item1 item8 item8 item8 item8 item2'
            'item3 item8 item8 item8 item8 item4'
            'item5 item8 item8 item8 item8 item6'
            'item7 item8 item8 item8 item8 item9'
            'item10 item11 item12 item13 item14 item15'; }
        .grid-item8 {
            grid-area: item8;
            }
            
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="grid-item item1">1</div>
        <div class="grid-item item2">2</div>
        <div class="grid-item item3">3</div>
        <div class="grid-item item4">4</div>
        <div class="grid-item item5">5</div>
        <div class="grid-item item6">6</div>
        <div class="grid-item item7">7</div>
        <div class="grid-item item8">8</div>
        <div class="grid-item item9">9</div>
        </div>
</body>
</html>
