<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            display:grid;
            grid-template-columns: auto auto;
            grid-template-areas: 
            'item1 item1'
            'item2 item3'
            'tem4 item5';
            gap:10px;
        }
        .item{
            background-color: rgb(247, 177, 188) ;
            padding:30px;
            text-align: center;
        }
        .item1 {
            grid-area: item1;
        }

    </style>
</head>
<body>
    <div class="box">
        <div class="item item1">Mục 1</div>
        <div class="item item2">Mục 2</div>
        <div class="item item3">Mục 3</div>
        <div class="item item4">Mục 4</div>
        <div class="item item5">Mục 5</div>
    </div>
</body>
</html>
