<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            display:grid;
            gap:10px;
            grid-template-columns: 200px 200px ;
            text-align: center;
            grid-auto-rows:200px 20vh; ;
        }
        .item{
            padding:40px;
            background-color:rgb(191, 218, 199)
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="item item1">Mục 1</div>
        <div class="item item2">Mục 2</div>
        <div class="item item3">Mục 3</div>
        <div class="item item4">Mục 4</div>
    </div>
</body>
</html>
