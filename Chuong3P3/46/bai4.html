<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            display:grid;
            grid-template-columns: auto auto auto auto;
            gap:20px;
            padding:20px;
        }
        .item{
            background-color: rgb(182, 232, 182);
            padding:30px;
            text-align: center;
            display:flex;
            align-items: center;
            justify-content:center ;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="item item1">Mục 1</div>
        <div class="item item2">Mục 2</div>
        <div class="item item3">Mục 3</div>
        <div class="item item4">Mục 4</div>
        <div class="item item5">Mục 5</div>
        <div class="item item6">Mục 6</div>
        <div class="item item7">Mục 7</div>
        <div class="item item8">Mục 8</div>

    </div>
</body>
</html>
