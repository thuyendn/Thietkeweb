<!DOCTYPE html>
<html>
<head>
    <style>
        .body {
            font-family: Arial;
            margin: 0;
            padding:0;
            background-color: white ;
        }
        span.ratingA {
            color:black
        }
        span.ratingB{
            color:rgba(160, 160, 160, 0.483);
        }
        span.ratingC{
            color:#ffcc00
        }
        span.price {
            font-weight: bold;
            font-size: 25px;
        }
        span.price>sup{
            vertical-align: super;
            text-decoration: underline;
        }
        .voucher{
            border:1px solid #b0b5bbf3;
            background-color:rgb(162, 162, 162) ;
            border-radius: 5px;
            margin-left: 10px;
        }
        .mau{
            font-weight: bold;
            font-size:20px;
        }
        .select1,.select2 {
            display: flex;
            border:1px solid;
            border-radius: 5px;
            width: 4cm;
            height:auto;
            margin-bottom: 0px;
            padding-top:1p;
            padding-bottom:10px; 
            justify-content:center;
            align-items: center;
        }
        .select1 img,.select2 img {
            width: 1cm; 
            height: auto; 
        }
        .field-container {
            display: flex; 
            gap: 10px;
        }        
    </style>
</head>
<body>
    <div class="header">
        <h1>Điện Thoại Samsung Galaxy S20 FE (8GB/256) - Hàng Chính Hãng</h1>
    </div>
    <span class="ratingA">4.8 </span>
    <span class="ratingC">★★★★★</span>
    <span class="ratingB">   (182) | Đã bán 564</span> <br>
    <span class="price">6.990.000<sup>đ</sup></span>
    <span class="voucher">-30%</span><br><br>
    <span class="mau">Màu</span><br>
    <div class="field-container">
        <fieldset class="select1">
            <img src="../D1/uploaded_5bc7091fae366efc39cfb28da28eb2461eb24492.jpg" >
            <span>Xanh Khí Chất</span>
        </fieldset>
        <fieldset class="select2">
            <img src="../D1/3e07a1821aeddc2e19622fbc872d0398.jpg">
            <span>Xanh Thanh Mát</span>
        </fieldset>
    </div>
</body>
</html>
