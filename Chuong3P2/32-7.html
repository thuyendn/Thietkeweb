<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
        }
        
        header {
            background-color: #FF7F50;
            padding: 10px;
            text-align: right;
        }
        
        .login-form input {
            padding: 5px;
            margin-right: 5px;
        }
        
        .login-form button {
            padding: 5px 10px;
            background-color: #333;
            color: white;
            border: none;
        }
        
        .container {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
        }
        
        .sidebar {
            background-color: #f1f1f1;
            padding: 10px;
            width: 20%;
        }
        
        .main-column {
            background-color: #fafafa;
            padding: 10px;
            width: 55%;
        }
        
        .features {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }
        
        .feature {
            background-color: #B0E0E6;
            padding: 10px;
            width: 30%;
        }
        
        .center-items {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }
        
        .item {
            background-color: #FF6347;
            padding: 20px;
            width: 50px;
            text-align: center;
            color: white;
            font-weight: bold;
        }
        
        .center-box {
            background-color: #98FB98;
            text-align: center;
            padding: 40px;
            margin: 20px 0;
        }
        
        .chart {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }
        
        .bar {
            background-color: #FF4500;
            width: 50px;
            text-align: center;
            color: white;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            font-size: 14px;
            height: 100px;
        }
        
        .footer-text {
            margin-top: 20px;
            background-color: #f1f1f1;
            padding: 10px;
            text-align: center;
        }
        
    </style>
</head>
<body>

    <!-- Header with login form -->
    <header>
        <div class="header-content">
            <form class="login-form">
                <input type="text" placeholder="Name">
                <input type="password" placeholder="Password">
                <button type="submit">Login</button>
            </form>
        </div>
    </header>

    <!-- Main content area -->
    <main>
        <div class="container">
            <div class="sidebar">Sidebar one</div>
            <div class="main-column">
                Main column
            </div>
            <div class="sidebar">Sidebar two</div>
        </div>

        <div class="features">
            <div class="feature">Feature 1</div>
            <div class="feature">Feature 2</div>
            <div class="feature">Feature 3</div>
        </div>

        <div class="center-items">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
            <div class="item">4</div>
            <div class="item">5</div>
        </div>

        <div class="center-box">Center item</div>

        <div class="chart">
            <!-- Fake bar chart for visualization -->
            <div class="bar" style="height: 50%;">50%</div>
            <div class="bar" style="height: 25%;">25%</div>
            <div class="bar" style="height: 75%;">75%</div>
            <div class="bar" style="height: 60%;">60%</div>
            <div class="bar" style="height: 90%;">90%</div>
        </div>

        <div class="footer-text">
            Footer text content goes here
        </div>
    </main>

</body>
</html>
