
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: rgb(0, 187, 255);
            color:blue;
            padding: 10px 15px  ; 
        }
        @media (max-width: 1023px) {
            nav {
                justify-content: center; 
            }
        }
        @media (max-width: 767px) {
            nav {
                flex-direction: column;
                text-align: center;
            }
            nav a {
                padding: 15px 0;
            }
        }
        nav a {
                text-decoration: none; 
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Products</a>
            <a href="#">Contact</a>
        </nav>
    </div>
</body>
</html>
