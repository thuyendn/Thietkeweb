<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Culinary Blog</title>
    <style>
        /* General Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }

        /* Header Styles */
        header {
            background-color: #2b2b4f;
            padding: 15px;
        }

        header ul {
            list-style: none;
            display: flex;
            justify-content: space-around;
        }

        header ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        header ul li a:hover {
            text-decoration: underline;
        }

        /* Search Bar */
        .search-bar {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .search-bar input {
            padding: 10px;
            border: 1px solid #ccc;
            width: 300px;
            border-radius: 5px 0 0 5px;
        }

        .search-bar button {
            padding: 10px;
            border: none;
            background-color: #2b2b4f;
            color: white;
            border-radius: 0 5px 5px 0;
            cursor: pointer;
        }

        .search-bar button:hover {
            background-color: #1f1f3b;
        }

        /* Image Grid */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .image-grid img {
            width: 100%;
            border-radius: 10px;
        }

    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Culinary Blog</a></li>
                <li><a href="#">Menu</a></li>
                <li><a href="#">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <!-- Search Bar -->
    <div class="search-bar">
        <input type="text" placeholder="Enter text here..">
        <button>Search</button>
    </div>

    <!-- Image Grid -->
    <div class="image-grid">
        <img src="https://via.placeholder.com/150" alt="Food Image 1">
        <img src="https://via.placeholder.com/150" alt="Food Image 2">
        <img src="https://via.placeholder.com/150" alt="Food Image 3">
        <img src="https://via.placeholder.com/150" alt="Food Image 4">
        <img src="https://via.placeholder.com/150" alt="Food Image 5">
        <img src="https://via.placeholder.com/150" alt="Food Image 6">
    </div>
</body>
</html>
