


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="nhap.css">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing:border-box;
        }
        
        @media screen and (min-width:1024px){
        
            nav {
                height: 20%;
                width: 100%;
                font-weight: 700;
            }
        
            header {
                background-color: red;
                text-align: center;
                padding: 10px;
            }
        
            main {
                display: flex;
                width: 100%;
                justify-content: space-between;
            }
        
            .aside1 {
                width: 20%;
                background-color: gold;
                padding: 10px;
                display: flex;
                justify-content: center;
                order: 1;
                
            }
        
            .maincontent {
                background-color: rgb(81, 81, 189);
                width: 60%;
                text-align: center;
                padding: 10px;
                display: flex;
                justify-content: center;
                order: 2;
        
            }
        
            .aside2 {
                width: 20%;
                text-align: center;
                background-color: pink;
                padding: 10px;
                display: flex;
                justify-content: center;
                order: 3;
            }
        
            footer {
                background-color: greenyellow;
                text-align: center;
                padding: 10px;
                padding: 10px;
            }
        }
        
        @media screen and (min-width: 768px) and (max-width: 1024px) {
            nav {
                height: 500px;
                width: 100%;
                font-weight: 900;
            }
        
            header {
                height: 10%;
                text-align: center;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: red;
            }
        
            main {
                height: 20%;
                display: flex;
                flex-direction: row;
            }
            .aside1 {
                order: 3;
                background-color: gold;
                text-align: center;
                flex-grow: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                position: absolute;
                width: 50%;
                height: 50px;
                margin-top: 100px;
            }
            .maincontent {
                order: 1;
                background-color: rgb(165, 165, 222);
                text-align: center;
                flex-grow: 2;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
            }
            .aside2 {
                order: 2;
                background-color: pink;
                text-align: center;
                flex-grow: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                position: absolute;
                margin-left: 50%;
                width: 50%;
                height: 50px;
                margin-top: 100px;
            }
            footer {
                height: 10%;
                text-align: center;
                padding: 20px;
                background-color: greenyellow;
                margin-top: 50px;
            }
        }
        
        @media screen and (max-width:768px){
            nav {
                height: 600px;
                width: 100%;
                font-weight: 700;
            }
        
            header {
                height: 10%;
                text-align: center;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: red;
            }
        
            main {
                height: 200px;
                display: flex;
                flex-direction: column;
            }
            .aside1 {
                order: 2;
                background-color: gold;
                text-align: center;
                flex-grow: 1;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .maincontent {
                order: 1;
                background-color: rgb(165, 165, 222);
                text-align: center;
                flex-grow: 2;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .aside2 {
                order: 3;
                background-color: pink;
                text-align: center;
                flex-grow: 1;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            footer {
                height: 10%;
                text-align: center;
                padding: 20px;
                background-color: greenyellow;
            }
        }
    </style>
</head>
<body>
    <nav>
        <header>Header</header>
        <main>
            <div class="maincontent">Main Content</div>
            <div class="aside1">Aside1</div>
            <div class="aside2">Aside2</div>
        </main>
        <footer>Footer</footer>
    </nav>
</body>
</html>
