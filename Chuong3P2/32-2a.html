<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .row{
            display:flex;
            align-items: stretch;
        }
        .row .container {
            display: flex;
            flex:1;
            justify-content: flex-start;

    
        }
        .row .label {
            display:0 0 auto;
            font-family: Verdana, Geneva, Tahoma, sans-serif;

        }
        .row .dish{
            display:1;
            justify-content: center;
            align-items: center;
        }
        .pasta{background-color: #ee9972;}
        .pizza{background-color: #f4ce14;}
        .burrito{background-color: #495E57;}
    </style>
    
</head>
<body>
    <div class="row">
        <div class="label"> Preferred dishes </div>
        <div class="container">
            <div class="dish pasta"style="flex-basis:35% ">35%</div>
            <div class="dish pizza"style="flex-basis:50% ">50%</div>
            <div class="dish burrito"style="flex-basis:15% ">15%</div>
        </div>
    </div>
</body>
</html>
