
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .form{
            border:1px solid rgb(185, 182, 182);
            padding: 10px;
            color: aliceblue;

        }
        .bt{
            width:70px
        }
        .ds{
            display: flex;
        }
        
        @media (max-width:640px) {
            body{
                background-color:#038988;
            }
            .ds{
                flex-direction: column;
                margin: 5px;
            }

        }
        @media (min-width:768px) {
            body{
                background-color: #8a2be1;
            }
            
            
            .io{
                display: flex;
                justify-content: center;
            }
            .lable{
                display:flex;
                flex-direction: column; 
                width:150px;
                margin:5px;
                font-weight: bold;
            }
            .input{ 
                display:flex;
                flex-direction: column;  
                width:400px;
                margin:5px
            }
        }
        @media (min-width:1024px) {
            body{
                background-color: blue;
            }
            .io{
                display:flex;
                justify-content: center;
            }
            .input{
                width:250px;
            }
        }
    </style>
</head>
<body>
    <div class="io">
        <form action="" class="form">
            <div class="ds">
                <label class="lable" for="name">Họ tên</label>
                <input class="input" type="text" id="name">
            </div>
            <div class="ds">
                <label class="lable" for="ngay">Ngày sinh</label>
                <input class="input" type="date" id="ngay">
            </div>
            <div class="ds">
                <label class="lable" for="email">Email</label>
                <input class="input" type="email" id="email">
            </div>
            <div class="ds">
                <label class="lable" for="sdt">SĐT</label>
                <input class="input" type="number" id="sdt">
            </div>
            <div class="ds" >
                <button class="bt">Đăng ký</button>
            </div>
        </form>
    </div>
    
</body>
</html>
