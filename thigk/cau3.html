<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">
    <link rel="stylesheet" href="./2.css" </head>
    <style>
            body {
          background-color: blueviolet;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
        }

        .container {
          display: flex;
          background-color: white;
          width: 100%;
          padding: 30px 20px 10px 50px;
          margin-right: 5px;
          box-sizing: border-box;
        }

        .input {
          width: 100%;
          display: flex;
          border: none;
          background-color: aliceblue;
          margin: 3px;
          padding: 4px;
          height: 5vh;
        }

        form {
          display: flex;
          flex-direction: column;
        }

        .form {
          flex-grow: 1;
          /*cái nì đây*/
          padding: 5px;
          box-sizing: border-box;
        }

        .contact-info i {
          color: rgb(0, 55, 255);
          margin-bottom: -10px;
        }

        .contact-info {
          display: flex;
          flex-direction: column;
          align-items: center;
          margin-right: 10px;
          justify-content: space-around;
          text-align: center;
        }

        .hd {
          color: rgb(0, 55, 255);
          font-weight: bold;
        }

       

        .tag i {
          margin-bottom: 5px;
          /* Hoặc 0 nếu bạn muốn không có khoảng cách */
        }
        .dc{
            margin-bottom: -10px;
        }
        

    </style>

<body>
    <div class="container">
        <div class="contact-info">
            <div class="tag">
                <i class="fas fa-map-marker-alt"></i><br>
                
                <p class='dc'>Address</p>
                <p style="color:grey">Halo</p>

            </div>

            <div class="tag">
                <i class="fas fa-phone-alt"></i>
                <p class='dc'>Phone</p>
            </div>

            <div class="tag">
                <i class="fas fa-envelope"></i>
                <p class='dc'>Email</p>
            </div>
        </div>

        <div class="form">
            <form>
                <div class="hd">Send us a message</div>
                <div class="nd">If you have any word</div>

                <input type="text" placeholder="Enter your name" class="input input1" required>
                <input type="email" placeholder="Enter your email" class="input input2" required>
                <textarea placeholder="Enter your message" class="input input3" required></textarea> <br>

            </form>
            <button type="submit">Send Now</button>
        </div>
    </div>
</body>

</html>
