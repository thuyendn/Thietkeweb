<!-- onclick : khi click lên đối tượng
❑ onchange : khi giá trị thẻ thành phần của đối tượng được thay đổi
❑ onmouseover : khi đưa chuột vào đối tượng
❑ onmouseout : khi đưa chuột ra ngoài khỏi đối tượng
❑ onkeydown : khi nhập dữ liệu vào textbox
❑ onload : khi trang web được load lên
 -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>My first js</h3>
    <button type="button"
    onclick ="alert('Xin chào !Hnay có phẻ kh')">click me</button>
  
    <br>
    <div id="mau">chọn 
    </div>
    <br>
    <span onmouseover ="document.getElementById('mau').innerHTML='Màu xanh' ">màu xanh</span>
    <span onmouseover ="document.getElementById('mau').innerHTML='Màu đỏ' ">màu đỏ</span>
</body>
</html>
