<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="showTime()">The time is?</button>
    <p id="showTimeHere"></p>
    <script>
        function showTime(){
            document.getElementById("showTimeHere").innerHTML=Date();
        }
    </script>
</body>
</html>
