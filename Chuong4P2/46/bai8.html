<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Di chuột vào đoạn văn</h1>
    <p>Đây là một đoạn văn. Hãy thử di chuột vào nó</p>
    <p onmouseover="document.getElementsByTagName('p')[1].innerHTML='Bạn đang di chuột vào đoạn văn'"
    onmouseout="document.getElementsByTagName('p')[1].innerHTML='Bạn đã di chuột ra ngoài đoạn văn'"
    >Đoạn văn trước khi thực hiện</p>
</body>
</html>
