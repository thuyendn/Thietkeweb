<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>title</title>
    <style>
        .bt{
            background-color: red;
            border:none;
            color:yellow;
            padding:10px;
            gap:5px;
            
  
        }

        
        #city{
            border:5px solid crimson;
            width:400px;
            height:auto;
            margin:5px;
        }
        body{
            text-align: center;
            display: flex;
            flex-direction: column;    
            align-items: center;
            justify-content: center;
            height: 100vh;

        }
        .conatainer{
            display:flex;
            justify-content: center;
        }
    </style>
  </head>
  <body>
    <img id="city">
    <div class="container">
        

        <button class="bt"
        onclick="document.getElementById('city').src='hanoi.jpg'">
        Hà Nội</button>
    
        <button class="bt"
        onclick="document.getElementById('city').src='hue.webp'">
        Huế</button>
    
        <button class="bt"
        onclick="document.getElementById('city').src='dn.jpg'">
        Đà Nẵng</button>
    
    </div>

  </body>
</html>
